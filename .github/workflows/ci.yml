name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Packed tarball installs and runs
        run: |
          npm pack --silent
          tmp="$(mktemp -d)"
          cd "$tmp"
          npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/yardhand-*.tgz
          npx yardhand init --yes
          npx yardhand new smoke-test
          npx yardhand validate
