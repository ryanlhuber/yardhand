name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        exclude:
          # Node 20 can't expand the test glob itself, and cmd.exe doesn't either.
          # Node 20 is end-of-life; see issue 000.05.
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Packed tarball installs and runs
        shell: bash
        run: |
          npm pack --silent
          tmp="$(mktemp -d)"
          cd "$tmp"
          npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/yardhand-*.tgz
          npx yardhand init --yes
          npx yardhand new smoke-test
          npx yardhand validate
